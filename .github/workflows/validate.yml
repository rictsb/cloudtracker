name: validate-research-pricing
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check canonical data
        run: node checks.js
      - name: Verify application and research parity
        run: node verify.cjs
      - name: Verify pricing cohorts and renewal assumptions
        run: node verify-pricing.cjs
      - name: Verify pricing evidence and conflict checks
        run: node verify-pricing-checks.cjs
      - name: Verify contract and financing calendars
        run: node verify-pricing-finance.cjs
      - name: Verify market quote refresh and cache behavior
        run: node verify-quotes.cjs
      - name: Verify shared research values and market references
        run: node verify-market-research.cjs
      - name: Verify shared market snapshot publication
        run: node verify-quote-snapshot.cjs
