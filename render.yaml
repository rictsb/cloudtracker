# Routing for the Render Static Site — source of truth, mirrored in the dashboard
# (Settings → Redirects/Rewrites; this service predates Blueprints, so the dashboard
# rules are the live ones and must match this file). First match wins.
#
# Verified live 2026-09-15: Render serves an EXISTING file before applying rules
# (so redirects for deleted pages activate on deletion), while extensionless paths
# hit the rules (so /iren rewrites to the app, never the old alias). Rewrites are
# enumerated per route rather than a /* catch-all: real files can never be swallowed,
# and unknown paths return Render's 404.
routes:
  # Legacy research URLs → their client-rendered replacements (pages retired 2026-09-15)
  - type: redirect
    source: /iren.html
    destination: /iren
  - type: redirect
    source: /crwv.html
    destination: /crwv
  - type: redirect
    source: /nbis.html
    destination: /nbis
  - type: redirect
    source: /compare.html
    destination: /research/compare
  - type: redirect
    source: /compare
    destination: /research/compare
  # SPA routes → the app shell
  - type: rewrite
    source: /company/*
    destination: /index.html
  - type: rewrite
    source: /iren
    destination: /index.html
  - type: rewrite
    source: /crwv
    destination: /index.html
  - type: rewrite
    source: /nbis
    destination: /index.html
  - type: rewrite
    source: /infrastructure
    destination: /index.html
  - type: rewrite
    source: /research
    destination: /index.html
  - type: rewrite
    source: /research/*
    destination: /index.html
  - type: rewrite
    source: /portfolio
    destination: /index.html
  - type: rewrite
    source: /news
    destination: /index.html
  - type: rewrite
    source: /checks
    destination: /index.html
  - type: rewrite
    source: /approvals
    destination: /index.html
